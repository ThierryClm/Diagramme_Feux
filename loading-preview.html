<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TraCflux - Démarrage (preview)...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }
  .logo { width: 88px; height: 88px; margin-bottom: 20px; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #333;
    border-top: 4px solid #4ecdc4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.3em; color: #4ecdc4; margin-bottom: 8px; }
  p { color: #888; font-size: 0.9em; }
  .dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
  @keyframes dots {
    0% { content: ''; } 25% { content: '.'; }
    50% { content: '..'; } 75% { content: '...'; }
  }
</style>
</head>
<body>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <path d="M 62.7 22.3 A 18 18 0 1 0 62.7 47.7" fill="none" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="24" r="5" fill="#E53935"/>
    <circle cx="58" cy="35" r="5" fill="#FB8C00"/>
    <circle cx="58" cy="46" r="5" fill="#43A047"/>
    <rect x="44" y="29" width="6" height="45" fill="#e0e0e0"/>
    <rect x="30" y="74" width="36" height="5" fill="#e0e0e0"/>
  </svg>
  <h1>TraCflux</h1>
  <div class="spinner"></div>
  <p>Compilation et démarrage (preview)<span class="dots"></span></p>
<script>
  // Le build peut prendre 30-60 s. On poll le serveur preview (port 4173)
  // jusqu'à ce qu'il réponde, puis on redirige.
  var url = 'http://localhost:4173';
  function check() {
    fetch(url, { mode: 'no-cors' })
      .then(function() { window.location.replace(url); })
      .catch(function() { setTimeout(check, 1000); });
  }
  check();
</script>
</body>
</html>
