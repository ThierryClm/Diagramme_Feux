<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagramme de Feux - Chargement...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #333;
    border-top: 4px solid #4ecdc4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.3em; color: #4ecdc4; margin-bottom: 8px; }
  p { color: #888; font-size: 0.9em; }
  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Diagramme de Feux Tricolores</h1>
  <p>Chargement de l'application<span class="dots"></span></p>
<script>
  var url = 'http://localhost:3000';
  function check() {
    fetch(url, { mode: 'no-cors' })
      .then(function() { window.location.replace(url); })
      .catch(function() { setTimeout(check, 800); });
  }
  check();
</script>
</body>
</html>
