<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraCflux</title>
    <meta name="description" content="Outil libre de conception et d'optimisation de plans de feux tricolores. S'ouvre dans le navigateur, sans installation ni serveur : les données restent sur votre poste." />

    <!-- Balises de partage : ce que voient LinkedIn, Slack, Teams ou un client
         de messagerie quand quelqu'un relaie l'adresse. Sans elles, le lien se
         présente par une URL nue. L'adresse de l'image doit être absolue —
         à reprendre en cas de passage à un nom de domaine propre. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TraCflux" />
    <meta property="og:title" content="TraCflux — diagrammes de feux tricolores" />
    <meta property="og:description" content="Concevoir et optimiser les plans de feux : matrice d'intervert, micro-régulation, priorité bus, onde verte. Libre, gratuit, sans installation." />
    <meta property="og:url" content="https://thierryclm.github.io/Diagramme_Feux/" />
    <meta property="og:image" content="https://thierryclm.github.io/Diagramme_Feux/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!-- Splash de lancement : visible pendant le chargement du bundle,
           remplacé automatiquement dès que React monte dans #root. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e1e1e;">
        <img src="./logo.svg" alt="TraCflux" width="96" height="96" style="margin-bottom:18px" />
        <div style="color:#4ecdc4;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.4em;font-weight:bold;letter-spacing:0.5px;">TraCflux</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
