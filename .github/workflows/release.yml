name: Publier la release

# Crée la release GitHub à partir de la section correspondante du CHANGELOG.
#
# Deux déclencheurs :
#   - automatique, à la poussée d'un tag vX.Y.Z (`git push --follow-tags`) ;
#   - manuel, en saisissant un tag existant — utile pour rattraper une version
#     taguée avant la mise en place de ce workflow.
#
# Le corps de la release n'est jamais inventé : il est extrait du CHANGELOG, et
# le job échoue si la section est absente. Une release sans notes ne vaut pas
# mieux que pas de release du tout.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Extraire les notes du CHANGELOG
        run: node scripts/changelog-section.mjs "${{ steps.tag.outputs.name }}" > notes.md

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "TraCflux $TAG"
          else
            gh release create "$TAG" --notes-file notes.md --title "TraCflux $TAG"
          fi
